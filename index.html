<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โพสต์ทั้งหมดจาก @MiracleGoldSP - IKIZULIVE!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000; /* พื้นหลังดำแบบ X dark mode */
            color: #e7e9ea; /* สีตัวอักษรขาวอมเทา */
        }
        .container {
            max-width: 600px; /* ความกว้างเหมือน feed ในแอป */
            margin: 0 auto;
            background: #000000;
            min-height: 100vh;
            padding: 20px 15px;
        }
        h1 {
            text-align: center;
            color: #1d9bf0; /* สีน้ำเงิน X */
            font-size: 24px;
            margin: 20px 0;
        }
        .intro {
            text-align: center;
            color: #71767b;
            font-size: 16px;
            margin-bottom: 30px;
        }
        /* ทำให้ widget โปร่งใส แล้วให้ container เป็นดำแทน */
        .twitter-timeline-wrapper {
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2f3336; /* ขอบเทาเข้มเหมือน X */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IKIZULIVE! LOVELIVE! BLUEBIRD</h1>
        <p class="intro">
            โพสต์ทั้งหมดจาก 金澤奇跡 @MiracleGoldSP<br>
            #いきづらい部！メンバー公式アカウント
        </p>
        
        <div class="twitter-timeline-wrapper">
            <a class="twitter-timeline"
               href="https://twitter.com/MiracleGoldSP"
               data-theme="dark"
               data-height="2000"          <!-- ยาวมากขึ้นเพื่อเลื่อนดูได้เยอะ -->
               data-chrome="noheader nofooter noborders transparent"
               data-lang="th"              <!-- ภาษาไทย -->
               data-link-color="#1d9bf0">  <!-- ลิงก์สีน้ำเงิน X -->
            Tweets by @MiracleGoldSP
            </a>
        </div>

        <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    </div>
</body>
</html>
